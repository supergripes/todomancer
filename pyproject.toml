[project]
name = "todomancer"
version = "0.1.0"
description = "Scan a codebase for TODO/FIXME/HACK comments, cluster them by semantic similarity, and report them by priority."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "supergripes" }]
dependencies = [
    "typer>=0.12",
    "sentence-transformers>=3.0",
    "rich>=13.0",
]

[project.scripts]
todomancer = "todomancer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todomancer"]
